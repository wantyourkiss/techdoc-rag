name: Minimal deployment and contract regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements-minimal.txt pytest
      - name: Synthetic contract and BM25 regression (no provider calls)
        run: python -m scripts.evaluate_regression --output-dir /tmp/rag-regression
      - name: Guard and provider regression
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Browser controller regression
        run: node --test tests/*.test.cjs
      - name: Isolated startup and source import
        run: python scripts/smoke_minimal.py
      - name: Build minimal runtime image
        run: docker build --target runtime -t techdoc-rag-ci .
      - name: Container startup, authentication, import and reader
        run: docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m --cap-drop ALL --security-opt no-new-privileges techdoc-rag-ci python scripts/smoke_minimal.py
